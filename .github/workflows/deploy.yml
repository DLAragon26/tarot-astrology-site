name: Deploy to GitHub Pages

# 部署前在仓库 Settings → Secrets and variables → Actions → Variables 里配置三项（公开值，非密钥）：
#   SITE_URL             = https://<username>.github.io
#   PUBLIC_BASE_PATH     = /<repo-name>            （仓库名以 / 开头，如 /tarot-astrology-site）
#   PUBLIC_API_BASE_URL  = https://tarot-astrology-api.<你的子域>.workers.dev
# 未配置时使用下面的占位默认值，构建仍会成功，但页面会连到错误的 API 地址。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build static site
        working-directory: web
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://USERNAME.github.io' }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/tarot-astrology-site' }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://tarot-astrology-api.REPLACE_WITH_YOUR_WORKERS_SUBDOMAIN.workers.dev' }}
        run: npm run build

      - name: Check subpath links (fail on broken base URLs)
        env:
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/tarot-astrology-site' }}
        run: node scripts/check-base-links.mjs

      - name: Verify card asset manifest
        run: node scripts/gen-card-assets.mjs --check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
