name: Deploy to GitHub Pages

# 部署前在仓库 Settings → Secrets and variables → Actions → Variables 里配置三项（公开值，非密钥）：
#   SITE_URL             = https://aragontarotastro.asia
#   PUBLIC_BASE_PATH     = /
#   PUBLIC_API_BASE_URL  = https://tarot-astrology-api.<你的子域>.workers.dev
# 未配置时使用下面的占位默认值，构建仍会成功，但页面会连到错误的 API 地址。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard — require real site variables (fail on placeholders)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          fail=0
          if [ -z "$PUBLIC_API_BASE_URL" ] || echo "$PUBLIC_API_BASE_URL" | grep -qiE 'REPLACE_WITH|USERNAME\.github\.io'; then
            echo "::error::Repository Variable PUBLIC_API_BASE_URL 缺失或仍是占位符。请在 Settings → Secrets and variables → Actions → Variables 配置你的 Worker 地址。"
            fail=1
          fi
          if [ -z "$SITE_URL" ] || echo "$SITE_URL" | grep -qiE 'USERNAME\.github\.io'; then
            echo "::error::Repository Variable SITE_URL 缺失或仍是占位符。请配置为 https://aragontarotastro.asia。"
            fail=1
          fi
          exit $fail

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Typecheck and scan
        run: npm run check

      - name: Unit and API integration tests
        run: npm test

      - name: Build static site
        working-directory: web
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://aragontarotastro.asia' }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/' }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://tarot-astrology-api.REPLACE_WITH_YOUR_WORKERS_SUBDOMAIN.workers.dev' }}
        run: npm run build

      - name: Check internal links (fail on broken base URLs)
        env:
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/' }}
        run: node scripts/check-base-links.mjs

      - name: Verify card assets and manifest
        run: |
          npm run cards:verify
          npm run cards:assets:check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
