name: Deploy Worker

# C4：Worker 自动部署。需要仓库 Secret：CLOUDFLARE_API_TOKEN（Cloudflare → My Profile → API Tokens，
# 模板 "Edit Cloudflare Workers"，并包含 D1 写权限）。未配置时本 workflow 会跳过并提示，不会失败。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard — check CLOUDFLARE_API_TOKEN presence
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 Secret CLOUDFLARE_API_TOKEN，跳过 Worker 部署。配置后 push 即自动部署。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (workspaces)
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Apply D1 migrations (remote)
        if: steps.guard.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply tarot-astrology --remote

      - name: Deploy Worker
        if: steps.guard.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
